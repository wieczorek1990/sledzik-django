<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample.</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% url 'style-css' %}">
</head>
<body>
Sample Śledzik integrated website.
<div style="margin-top: 15px;">
    <label for="token">Token: </label>
    <input type="text" id="token" name="token" value="" size="40">
</div>
<div class="mt-3">
    <label for="action">Action: </label>
    <select id="action" name="action" disabled>
        <option value="">Enter a token to load actions</option>
    </select>
</div>
<div class="mt-3">
    <button id="hit" class="btn btn-primary" type="button" disabled>Hit</button>
    <button id="logout" class="btn btn-outline-secondary" type="button">Logout</button>
</div>
<div id="user-info" style="margin-top: 10px; font-weight: bold;"></div>
<div id="status" style="margin-top: 10px;" role="status"></div>

<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="{% url 'extension' %}" id="śledzik-script"></script>
<script src="{% url 'sample-js' %}"></script>
</body>
</html>
