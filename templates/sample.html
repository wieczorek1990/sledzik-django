<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample.</title>
</head>
<body>
It works!
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="/extension/" id="sledzik-script"></script>
<script>
    const TOKEN = "ed74e235-7a7f-4190-b3c9-6a04258ed899";

    const ACTIONS = {
        ready: 1,
        email: 2,
    };

    const action_ready_url = window.Śledzik.getUrl(ACTIONS.ready);
    const action_email_url = window.Śledzik.getUrl(ACTIONS.email);

    function run(authToken) {
        console.log("Running...");
        window.Śledzik.hit(action_ready_url, TOKEN, function() {
            console.log("Hit successful.");
        }, authToken);
        window.Śledzik.hit(action_email_url, TOKEN, function() {
            console.log("Hit successful.");
        }, authToken);
    }

    function authorize(username, password) {
        return fetch("/api/auth/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(response) {
            if (!response.ok) {
                throw new Error("Authorization failed");
            }
            return response.json();
        })
        .then(function(data) {
            if (window.Śledzik.setAuthToken) {
                window.Śledzik.setAuthToken(data.token);
            }
            return data.token;
        });
    }

    $(document).ready(function () {
        authorize("luke", "super")
            .then(function(authToken) {
                run(authToken);
            })
            .catch(function(err) {
                console.error("Auth error:", err);
            });
    });
</script>
</body>
</html>
