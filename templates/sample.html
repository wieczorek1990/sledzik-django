<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample.</title>
</head>
<body>
Sample.
<div style="margin-top: 15px;">
    <label for="token">Token: </label>
    <input type="text" id="token" name="token" value="" size="40">
    <label for="action">Action: </label>
    <select id="action" name="action" disabled>
        <option value="">Enter a token to load actions</option>
    </select>
    <button id="hit" type="button" disabled>Hit</button>
    <button id="logout" type="button">Logout</button>
</div>
<div id="user-info" style="margin-top: 10px; font-weight: bold;"></div>
<div id="status" style="margin-top: 10px;" role="status"></div>

<script src="{% url 'extension' %}" id="sledzik-script"></script>
<script>
    const tracker = window.Śledzik;
    const tokenInput = document.getElementById("token");
    const actionInput = document.getElementById("action");
    const hitButton = document.getElementById("hit");
    const userInfo = document.getElementById("user-info");
    const status = document.getElementById("status");
    const tokenStorageKey = "sledzik.sample.tenantToken";
    let authorizationPromise = null;
    let session = 0;
    let actionsRequest = 0;
    let actionsTimer;

    async function loadActions() {
        const requestId = ++actionsRequest;
        const token = rememberToken();
        const previousAction = actionInput.value;
        actionInput.disabled = true;
        hitButton.disabled = true;
        actionInput.replaceChildren(new Option(token ? "Loading actions..." : "Enter a token to load actions", ""));
        if (!token) return;
        try {
            const response = await fetch("{% url 'token-actions' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token })
            });
            if (!response.ok) throw new Error(`Could not load actions (HTTP ${response.status}).`);
            const actions = await response.json();
            if (requestId !== actionsRequest) return;
            actionInput.replaceChildren(...actions.map(action =>
                new Option(`${action.name} (#${action.id})`, String(action.id))
            ));
            if (actions.some(action => String(action.id) === previousAction)) actionInput.value = previousAction;
            if (!actions.length) actionInput.replaceChildren(new Option("No actions for this token", ""));
            actionInput.disabled = !actions.length;
            hitButton.disabled = !actions.length;
            status.textContent = "";
        } catch (error) {
            if (requestId !== actionsRequest) return;
            actionInput.replaceChildren(new Option("Actions unavailable", ""));
            status.textContent = error.message;
        }
    }

    try {
        tokenInput.value = window.localStorage.getItem(tokenStorageKey) || "";
    } catch (error) {
        // The sample still works when browser storage is disabled.
    }

    function rememberToken() {
        const token = tokenInput.value.trim();
        try {
            if (token) window.localStorage.setItem(tokenStorageKey, token);
            else window.localStorage.removeItem(tokenStorageKey);
        } catch (error) {
            // Keep using the input when browser storage is disabled.
        }
        return token;
    }

    async function authorize() {
        const savedToken = tracker.getAuthToken();
        if (savedToken) {
            userInfo.textContent = "Authorized with saved anonymous token.";
            return savedToken;
        }
        if (!authorizationPromise) {
            const currentSession = session;
            authorizationPromise = (async () => {
                const response = await fetch("{% url 'api-register-anonymous' %}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: "{}"
                });
                if (!response.ok) throw new Error(`Authorization failed (HTTP ${response.status}).`);
                const data = await response.json();
                if (currentSession !== session) return null;
                tracker.setAuthToken(data.token);
                userInfo.textContent = "Authorized as: " + data.username;
                return data.token;
            })().finally(() => {
                if (currentSession === session) authorizationPromise = null;
            });
        }
        return authorizationPromise;
    }

    function tokenChanged() {
        rememberToken();
        actionsRequest++;
        actionInput.disabled = true;
        hitButton.disabled = true;
        clearTimeout(actionsTimer);
        actionsTimer = setTimeout(loadActions, 300);
    }
    tokenInput.addEventListener("input", tokenChanged);
    tokenInput.addEventListener("change", tokenChanged);
    document.getElementById("logout").addEventListener("click", () => {
        session++;
        authorizationPromise = null;
        tracker.setAuthToken(null);
        userInfo.textContent = "Logged out.";
        status.textContent = "";
        hitButton.disabled = actionInput.disabled;
    });
    hitButton.addEventListener("click", async () => {
        const currentSession = session;
        const token = rememberToken();
        const actionId = actionInput.value;
        if (!token || actionInput.disabled || !actionId) {
            status.textContent = "Enter a valid token and choose an action.";
            return;
        }
        hitButton.disabled = true;
        const currentActionsRequest = actionsRequest;
        status.textContent = "Sending hit...";
        try {
            const authToken = await authorize();
            if (currentSession !== session || currentActionsRequest !== actionsRequest) return;
            const response = await tracker.hit(tracker.getUrl(actionId), token, null, authToken);
            if (currentSession !== session || currentActionsRequest !== actionsRequest) return;
            status.textContent = response.ok
                ? "Hit sent successfully!"
                : "Hit failed (e.g. invalid or rejected token).";
        } catch (error) {
            if (currentSession === session && currentActionsRequest === actionsRequest) status.textContent = "Error sending hit: " + error.message;
        } finally {
            if (currentSession === session && currentActionsRequest === actionsRequest) hitButton.disabled = actionInput.disabled;
        }
    });

    loadActions();
    authorize().catch(error => {
        if (session === 0) status.textContent = "Authorization error: " + error.message;
    });
</script>
</body>
</html>
