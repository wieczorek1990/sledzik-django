<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Śledzik</title>
    <link rel="icon" href="{% url 'favicon' %}?v=2" sizes="16x16 32x32 48x48" type="image/vnd.microsoft.icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% url 'style-css' %}">
</head>
<body class="dashboard">
{% include 'logo.html' %}

<div>
    <form id="login-form">
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button id="login" class="btn btn-primary" type="submit">Login</button>
        <button id="logout" class="btn btn-outline-secondary" type="button">Logout</button>
    </form>
    <p id="logged-as" aria-live="polite" hidden></p>
    <p id="auth-message" aria-live="polite"></p>
</div>

<section id="visit-counter" class="visit-counter" aria-labelledby="visit-counter-label" hidden>
    <h2 id="visit-counter-label" class="visit-counter__label">Total visits</h2>
    <span id="visit-count" class="visit-counter__value" aria-hidden="true">—</span>
    <span id="visit-count-announcement" role="status" class="visually-hidden"></span>
    <p id="visit-count-detail" class="visit-counter__detail">Recorded action hits across all your tenants · All time</p>
</section>

<div>
    <label for="tenant-select">Tenant:</label>
    <select id="tenant-select" aria-label="Select tenant">
        <option disabled selected>Loading…</option>
    </select>
</div><br/>

<div>
    <label for="project-select">Project:</label>
    <select id="project-select" aria-label="Select project">
        <option disabled selected>Select a tenant…</option>
    </select>
</div><br/>

<div>
    <label for="funnel-select">Funnel:</label>
    <select id="funnel-select" aria-label="Select funnel">
        <option disabled selected>Select a project…</option>
    </select>
</div><br/>

<div id="chart-section" style="display: none;">
    <hr class="chart-divider">
    <div id="chart-controls" style="margin-bottom: 12px;">
        <span style="font-weight: bold; margin-right: 8px;">Chart view:</span>
        <label style="cursor: pointer; margin-right: 16px;">
            <input type="radio" name="chart-type" value="timeseries" checked>
            Action Counters Over Time
        </label>
        <label style="cursor: pointer; margin-right: 16px;">
            <input type="radio" name="chart-type" value="viewers">
            Unique Viewers Over Time
        </label>
        <label style="cursor: pointer;">
            <input type="radio" name="chart-type" value="funnel">
            Funnel
        </label>
    </div>

    <span id="time-window-control">
    <label for="time-window">Time window:</label>
    <select id="time-window">
        <option value="year">Year</option>
        <option value="month">Month</option>
        <option value="day">Day</option>
        <option value="hour">Hour</option>
        <option value="30min">30 minutes</option>
        <option value="15min">15 minutes</option>
        <option value="5min">5 minutes</option>
        <option value="1min" selected>1 minute</option>
        <option value="12sec">12 seconds</option>
    </select>
    </span>
    <span id="action-control">
        <label for="chart-action">Action:</label>
        <select id="chart-action" aria-label="Chart action"></select>
    </span>
    <p id="chart-error" hidden></p>
    <div id="chart"></div>
</div><br/>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

<script>
$(document).ready(function () {

    const $message = $('#auth-message');
    const chartViewStorageKey = 'śledzik.chartView';
    const $chartTypes = $('input[name="chart-type"]');
    try {
        const savedView = window.localStorage.getItem(chartViewStorageKey);
        $chartTypes.filter(function () { return this.value === savedView; }).prop('checked', true);
    } catch (error) {
        // Use the default view when browser storage is unavailable.
    }

    // Increments on every login/logout; responses from an older
    // generation are discarded so stale fetches can't touch the DOM.
    let sessionGen = 0;

    function setMessage(text, isError) {
        $message.attr('id', isError ? 'auth-error' : 'auth-status')
                .text(text || '');
    }

    // ---- Auth -----------------------------------------------------------

    function getToken() {
        return window.localStorage.getItem('authorization');
    }

    function updateAuthUI() {
        const loggedIn = Boolean(getToken());
        $('#login').toggle(!loggedIn);
        $('#username').toggle(!loggedIn);
        $('#password').toggle(!loggedIn);
        $('#logout').toggle(loggedIn);
        $('#chart-section').toggle(loggedIn);
        $('#visit-counter').prop('hidden', !loggedIn);
        $('#logged-as').text(loggedIn ? 'Checking account…' : '').prop('hidden', !loggedIn);
        if (!loggedIn) {
            $('#chart-error').hide();
            Plotly.purge('chart');
        }
    }

    function logout(reason) {
        sessionGen++;   // invalidate all in-flight requests
        currentStats = null;
        cancelAnimationFrame(visitAnimation);
        displayedVisits = 0;
        $('#visit-count').text('—');
        $('#visit-count-announcement').text('');
        window.localStorage.removeItem('authorization');
        updateAuthUI();
        setMessage(reason || '❖ Logged out.', false);
        // Reset the selectors since we can no longer load any data
        $('#tenant-select').html('<option disabled selected>Log in to continue</option>');
        $('#project-select').html('<option disabled selected>Log in to continue</option>');
        $('#funnel-select').html('<option disabled selected>Log in to continue</option>');
    }

    function login(username, password) {
        fetch('/auth/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(r => {
            if (!r.ok) throw new Error(r.status === 400 ? '❖ Wrong username or password.' : `❖ Login failed (HTTP ${r.status})`);
            return r.json();
        })
        .then(data => {
            if (!data.token) throw new Error('No token in response.');
            window.localStorage.setItem('authorization', data.token);
            sessionGen++;   // start a fresh session generation
            updateAuthUI();
            setMessage('❖ Logged in.', false);
            loadTenants();                     // actually use the new session
        })
        .catch(err => setMessage(err.message, true));
    }

    $('#login-form').on('submit', function (e) {
        e.preventDefault();
        const username = $('#username').val().trim();
        const password = $('#password').val();
        if (!username || !password) {
            setMessage('❖ Enter both username and password.', true);
            return;
        }
        login(username, password);
    });

    $('#logout').on('click', function () {
        logout('❖ Logged out.');
    });

    // ---- API ------------------------------------------------------------

    // Build headers AT REQUEST TIME so a token stored after page load
    // (i.e. a fresh login) is picked up immediately.
    function requestJSON(url) {
        const headers = {};
        const token = getToken();
        if (token) headers['Authorization'] = 'Token ' + token;

        return fetch(url, { headers: headers }).then(r => {
            if (r.status === 401 || r.status === 403) {
                logout('❖ Session expired, please log in again.');
                throw new Error('Not authenticated.');
            }
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        });
    }

    // ---- Chart ----------------------------------------------------------

    let currentStats = null;
    let statisticsRequest = 0;
    let visitAnimation = 0;
    let displayedVisits = 0;
    let visitsRequest = 0;

    function animateVisits(total) {
        cancelAnimationFrame(visitAnimation);
        const startValue = displayedVisits;
        const started = performance.now();
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function frame(now) {
            const progress = reducedMotion ? 1 : Math.min((now - started) / 800, 1);
            displayedVisits = Math.round(startValue + (total - startValue) * (1 - Math.pow(1 - progress, 3)));
            $('#visit-count').text(displayedVisits.toLocaleString());
            if (progress < 1) visitAnimation = requestAnimationFrame(frame);
        }
        $('#visit-count-announcement').text(`${total.toLocaleString()} total visits.`);
        visitAnimation = requestAnimationFrame(frame);
    }

    function loadVisits() {
        const gen = sessionGen;
        const requestId = ++visitsRequest;
        return requestJSON('{% url "global-visits" %}').then(data => {
            if (gen !== sessionGen || requestId !== visitsRequest) return;
            animateVisits(data.visits);
            $('#visit-count-detail').text('Recorded action hits across all your tenants · All time');
        }).catch(error => {
            if (gen === sessionGen && requestId === visitsRequest && error.message !== 'Not authenticated.') {
                $('#visit-count-detail').text('Could not refresh visits. Retrying in 30 seconds.');
            }
        });
    }

    setInterval(() => {
        if (getToken() && !document.hidden) loadVisits();
    }, 30000);
    const plotTheme = {
        layout: {
            paper_bgcolor: '#a6dbff',
            plot_bgcolor: '#dbf1ff',
            font: { color: '#586e75', family: 'system-ui, sans-serif' },
            colorway: ['#657b83', '#859900', '#586e75', '#93a1a1'],
            xaxis: { gridcolor: '#a6dbff', linecolor: '#93a1a1', zerolinecolor: '#93a1a1' },
            yaxis: { gridcolor: '#a6dbff', linecolor: '#93a1a1', zerolinecolor: '#93a1a1' }
        }
    };

    function renderCurrentChart() {
        const chartType = $('input[name="chart-type"]:checked').val();
        $('#time-window-control').toggle(chartType !== 'funnel');
        $('#action-control').toggle(chartType === 'timeseries');
        if (!currentStats) return;
        if (chartType === 'funnel') {
            renderFunnelChart('chart', currentStats.result, currentStats.action_order);
        } else if (chartType === 'viewers') {
            renderTimeSeriesChart('chart', currentStats.unique_viewers, currentStats.result, true);
        } else {
            renderTimeSeriesChart('chart', currentStats.time_series, currentStats.result, false, currentStats.action_order);
        }
    }

    function renderFunnelChart(containerId, resultData, actionOrder) {
        document.getElementById('chart-error').hidden = true;
        const entries = Object.entries(resultData || {})
            .flatMap(([group, inner]) =>
                (actionOrder || Object.keys(inner)).map(key => ({
                    label: `${group} › ${key}`,
                    value: inner[key]
                }))
            );

        const funnelName = Object.keys(resultData || {})[0] || '';

        Plotly.newPlot(containerId, [{
            type: 'funnel',
            y: entries.map(e => e.label),
            x: entries.map(e => e.value),
            textinfo: 'value+percent initial'
        }], {
            template: plotTheme,
            title: funnelName ? `❖ Actions Funnel (${funnelName})` : '❖ Actions Funnel',
            height: 500,                                  // more vertical room for stages
            margin: { l: 150, r: 50, t: 60, b: 40 },      // widen left margin for labels
            yaxis: { automargin: true }                   // auto-fit label width
        }, { responsive: true });
    }

    function renderTimeSeriesChart(containerId, timeSeriesData, resultData, uniqueViewers = false, actionOrder) {
        document.getElementById('chart-error').hidden = true;
        const funnelName = Object.keys(resultData || {})[0] || '';
        const title = uniqueViewers ? 'Unique Viewers Over Time' : 'Action Counters Over Time';
        const yTitle = uniqueViewers ? 'Unique viewers' : 'Hits / Count';
        const actionSelect = document.getElementById('chart-action');
        const previousAction = actionSelect.value;
        const actions = actionOrder || Object.keys((resultData || {})[funnelName] || {});
        actionSelect.replaceChildren(...actions.map(action => new Option(action, action)));
        if (actions.includes(previousAction)) actionSelect.value = previousAction;
        const selectedAction = actionSelect.value;
        timeSeriesData = (timeSeriesData || []).filter(item => uniqueViewers || item.action === selectedAction);

        if (!timeSeriesData || timeSeriesData.length === 0) {
            Plotly.newPlot(containerId, [], {
                template: plotTheme,
                title: funnelName ? `❖ ${title} (${funnelName})` : `❖ ${title}`,
                annotations: [{
                    text: uniqueViewers ? '❖ No viewers recorded yet.' : '❖ No action counters recorded yet.',
                    xref: 'paper',
                    yref: 'paper',
                    showarrow: false,
                    font: { size: 16, color: '#586e75' }
                }],
                xaxis: { title: 'Created' },
                yaxis: { title: yTitle, rangemode: 'tozero', dtick: 1 },
                height: 500,
                margin: { l: 60, r: 50, t: 60, b: 60 }
            }, { responsive: true });
            return;
        }

        const traces = [{
            name: uniqueViewers ? 'Unique viewers' : selectedAction,
            x: timeSeriesData.map(item => item.created),
            y: timeSeriesData.map(item => item.count),
            type: 'scatter',
            mode: 'lines+markers',
            marker: { size: 8 },
            line: { shape: 'linear' }
        }];

        const timestamps = [...new Set(timeSeriesData.map(item => item.created))].sort();
        const visibleRange = timestamps.length > 30
            ? [timestamps[timestamps.length - 30], timestamps[timestamps.length - 1]]
            : undefined;

        Plotly.newPlot(containerId, traces, {
            template: plotTheme,
            title: funnelName ? `❖ ${title} (${funnelName})` : `❖ ${title}`,
            dragmode: 'pan',
            xaxis: {
                title: 'Created',
                type: 'date',
                range: visibleRange,
                rangeslider: { visible: true, thickness: 0.15 }
            },
            yaxis: { title: yTitle, rangemode: 'tozero', fixedrange: true, tickformat: ',d' },
            height: 500,
            margin: { l: 60, r: 50, t: 60, b: 60 }
        }, { responsive: true, scrollZoom: true });
    }

    function showChartError(message) {
        currentStats = null;
        Plotly.purge('chart');              // cleanly remove Plotly DOM/state
        const el = document.getElementById('chart-error');
        el.textContent = `Failed to load chart: ${message}`;
        el.hidden = false;
    }

    function fetchStatistics(funnelId) {
        const gen = sessionGen;
        const requestId = ++statisticsRequest;
        const windowSize = $('#time-window').val();
        return requestJSON(`/api/funnels/${encodeURIComponent(funnelId)}/statistics/?granularity=${encodeURIComponent(windowSize)}`)
            .then(data => {
                if (gen !== sessionGen || requestId !== statisticsRequest) return;
                if (!data || !data.result) throw new Error('Unexpected API response');
                currentStats = data;
                renderCurrentChart();
            })
            .catch(err => {
                if (gen === sessionGen && requestId === statisticsRequest && err.message !== 'Not authenticated.') {
                    showChartError(err.message);
                }
            });
    }

    $chartTypes.on('change', function () {
        try {
            window.localStorage.setItem(chartViewStorageKey, this.value);
        } catch (error) {
            // Keep switching views even when browser storage is unavailable.
        }
        renderCurrentChart();
    });

    $('#chart-action').on('change', renderCurrentChart);

    $('#time-window').on('change', function () {
        const funnelId = $('#funnel-select').val();
        if (funnelId) fetchStatistics(funnelId);
    });

    // ---- Cascade selectors ----------------------------------------------

    // Tenant change → reload its projects
    $('#tenant-select').on('change', function () {
        loadProjects($(this).val());
    });

    // Project change → reload its funnels
    $('#project-select').on('change', function () {
        loadFunnels($(this).val());
    });

    // Funnel change → fetch its statistics
    $('#funnel-select').on('change', function () {
        fetchStatistics($(this).val());
    });

    // ---- Initialization --------------------------------------------------

    function loadCurrentUser() {
        const gen = sessionGen;
        return requestJSON('{% url "current-user" %}').then(user => {
            if (gen === sessionGen) $('#logged-as').text(`Logged in as ${user.username}`);
        }).catch(error => {
            if (gen === sessionGen && error.message !== 'Not authenticated.') {
                $('#logged-as').text('Unable to load account.');
            }
        });
    }

    function loadTenants() {
        loadCurrentUser();
        loadVisits();
        const gen = sessionGen;
        return requestJSON('/api/tenants/')
            .then(tenants => {
                if (gen !== sessionGen) return;          // stale response — drop it
                const select = $('#tenant-select').empty();
                if (tenants.length === 0) {
                    select.append($('<option>').text('❖ No tenants available'));
                    $('#project-select').html('<option disabled selected>—</option>');
                    $('#funnel-select').html('<option disabled selected>—</option>');
                    return;
                }
                for (const tenant of tenants) {
                    $('<option>')
                        .attr('value', tenant.id)
                        .text(tenant.name)
                        .appendTo(select);
                }
                select.val(tenants[0].id);
                return loadProjects(tenants[0].id);
            })
            .catch(err => {
                if (gen === sessionGen && err.message !== 'Not authenticated.') {
                    $('#tenant-select').html('<option>Error loading tenants</option>');
                    showChartError('❖ Could not load tenant list');
                }
            });
    }

    function loadProjects(tenantId) {
        const gen = sessionGen;
        $('#project-select').html('<option disabled selected>Loading…</option>');
        $('#funnel-select').html('<option disabled selected>—</option>');
        return requestJSON(`/api/projects/?tenant=${encodeURIComponent(tenantId)}`)
            .then(projects => {
                if (gen !== sessionGen) return;          // stale response — drop it
                const select = $('#project-select').empty();
                if (projects.length === 0) {
                    select.append($('<option>').text('❖ No projects available'));
                    $('#funnel-select').html('<option disabled selected>—</option>');
                    showChartError('❖ This tenant has no projects');
                    return;
                }
                for (const project of projects) {
                    $('<option>')
                        .attr('value', project.id)
                        .text(project.name)
                        .appendTo(select);
                }
                select.val(projects[0].id);
                return loadFunnels(projects[0].id);
            })
            .catch(err => {
                if (gen === sessionGen && err.message !== 'Not authenticated.') {
                    $('#project-select').html('<option>Error loading projects</option>');
                    showChartError('❖ Could not load project list');
                }
            });
    }

    function loadFunnels(projectId) {
        const gen = sessionGen;
        $('#funnel-select').html('<option disabled selected>Loading…</option>');
        return requestJSON(`/api/funnels/?project=${encodeURIComponent(projectId)}`)
            .then(funnels => {
                if (gen !== sessionGen) return;          // stale response — drop it
                const select = $('#funnel-select').empty();
                if (funnels.length === 0) {
                    select.append($('<option>').text('❖ No funnels available'));
                    showChartError('❖ This project has no funnels');
                    return;
                }
                for (const funnel of funnels) {
                    $('<option>')
                        .attr('value', funnel.id)
                        .text(funnel.name)
                        .appendTo(select);
                }
                select.val(funnels[0].id);
                return fetchStatistics(funnels[0].id);
            })
            .catch(err => {
                if (gen === sessionGen && err.message !== 'Not authenticated.') {
                    $('#funnel-select').html('<option>Error loading funnels</option>');
                    showChartError('❖ Could not load funnel list');
                }
            });
    }

    updateAuthUI();
    renderCurrentChart();

    if (getToken()) {
        loadTenants();      // returning visitor with a valid token
    } else {
        $('#tenant-select').html('<option disabled selected>Log in to continue</option>');
        $('#project-select').html('<option disabled selected>Log in to continue</option>');
        $('#funnel-select').html('<option disabled selected>Log in to continue</option>');
        setMessage('❖ Please log in.', false);
    }
});
</script>

</body>
</html>
